name: focus_timer
description: A simple Pomodoro-style focus timer.
publish_to: 'none'

# version: <versionName>+<versionCode>. Bump the number after + for every Play upload.
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#CC4E48"
  adaptive_icon_foreground: assets/icon/foreground.png
  min_sdk_android: 21
